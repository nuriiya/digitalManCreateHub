services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: rag_pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  rag_pgdata: {}
