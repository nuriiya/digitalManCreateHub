# Prod override: no source mount (uses the built image), persistent named
# volumes for runtime data + docs, restart-on-failure and a healthcheck. Load
# after docker-compose.yml.
services:
  backend:
    restart: unless-stopped
    volumes:
      - backend_data:/app/backend/data
      - rag_docs:/data
      # 数据库导出目录（prod 用命名卷持久化，可挂 NFS/对象存储做大文件）
      - rag_exports:/app/exports
    environment:
      ENV: prod
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
