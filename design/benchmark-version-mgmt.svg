<svg viewBox="0 0 680 756" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>数字人测试闭环：四组对照 → GLM 归因提名 → 版本管理</title>
<desc>四组对照 benchmark，GLM 判卷与归因只提名，确定性代码终审，用户决定 merge 与回滚</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="30" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">数字人测试闭环：四组对照 → GLM 归因提名 → 版本管理</text>
<text x="340" y="52" text-anchor="middle" font-size="12" fill="#5F5E5A">LLM 只提名（虚线）· 确定性代码裁决（实线）· 用户终审（琥珀）</text>

<text x="40" y="88" font-size="12" fill="#5F5E5A">① 选题（0 LLM 确定性）</text>
<rect x="100" y="100" width="480" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="122" text-anchor="middle" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">本体段 source_candidate_id → mentions.chunk_id → quiz 关联</text>
<text x="340" y="144" text-anchor="middle" font-size="12" fill="#0F6E56" dominant-baseline="central">选与该数字人强相关的题（默认 15 题，上限 30，四组共用同一批）</text>
<path d="M340 158 L340 190" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="40" y="188" font-size="12" fill="#5F5E5A">② 四组对照答题 · 本地模型（chat_ollama 低温单次采样）</text>
<rect x="40" y="200" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="110" y="222" text-anchor="middle" font-size="13" font-weight="500" fill="#444441" dominant-baseline="central">G0 裸模型</text>
<text x="110" y="244" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">无 RAG 无本体</text>
<rect x="192" y="200" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="262" y="222" text-anchor="middle" font-size="13" font-weight="500" fill="#444441" dominant-baseline="central">G1 仅本体</text>
<text x="262" y="244" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">动态检索窗口 20%</text>
<rect x="344" y="200" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="414" y="222" text-anchor="middle" font-size="13" font-weight="500" fill="#444441" dominant-baseline="central">G2 仅 RAG</text>
<text x="414" y="244" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">search top3 原文</text>
<rect x="496" y="200" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="566" y="222" text-anchor="middle" font-size="13" font-weight="500" fill="#444441" dominant-baseline="central">G3 RAG+本体</text>
<text x="566" y="244" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">两者叠加</text>
<path d="M340 258 L340 284" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="40" y="278" font-size="12" fill="#5F5E5A">③ 判卷：GLM 提名 + 代码终审（每题每组）</text>
<rect x="40" y="288" width="186" height="64" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1" stroke-dasharray="4 3"/>
<text x="133" y="312" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">GLM 判卷（chat2）</text>
<text x="133" y="334" text-anchor="middle" font-size="12" fill="#185FA5" dominant-baseline="central">verdict 提名四分类</text>
<rect x="253" y="288" width="186" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="346" y="312" text-anchor="middle" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">确定性终审</text>
<text x="346" y="334" text-anchor="middle" font-size="12" fill="#0F6E56" dominant-baseline="central">闭集校验 + 拒答词检测</text>
<rect x="466" y="288" width="174" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="553" y="312" text-anchor="middle" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">统计 + 结论模板</text>
<text x="553" y="334" text-anchor="middle" font-size="12" fill="#0F6E56" dominant-baseline="central">代码生成 · 无 LLM</text>
<path d="M226 320 L251 320" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M439 320 L464 320" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="40" y="374" font-size="12" fill="#5F5E5A">结论（代码模板，卡片显示）：G3 80% &gt; G1 63% &gt; G2 55% &gt; G0 37%（30 题）</text>
<text x="40" y="392" font-size="12" fill="#5F5E5A">本体边际 = G3−G2 · RAG 边际 = G3−G1 · 总增益 = G3−G0</text>
<text x="40" y="410" font-size="12" fill="#5F5E5A">准确率 = correct · 幻觉率 = wrong · 拒答率 = refused（partial 单列）</text>

<text x="40" y="430" font-size="12" fill="#5F5E5A">④ 错误归因提名（输入：本体组 wrong / partial 的题）</text>
<rect x="40" y="440" width="186" height="64" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1" stroke-dasharray="4 3"/>
<text x="133" y="464" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">GLM 归因分析（chat2）</text>
<text x="133" y="486" text-anchor="middle" font-size="12" fill="#185FA5" dominant-baseline="central">提名问题本体 + 动作</text>
<rect x="253" y="440" width="186" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="346" y="464" text-anchor="middle" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">确定性闭集校验</text>
<text x="346" y="486" text-anchor="middle" font-size="12" fill="#0F6E56" dominant-baseline="central">name ∈ 该题注入本体 ∧ active</text>
<rect x="466" y="440" width="174" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="553" y="464" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489" dominant-baseline="central">待审变更集（pending）</text>
<text x="553" y="486" text-anchor="middle" font-size="12" fill="#534AB7" dominant-baseline="central">persona_ontology_changes</text>
<path d="M226 472 L251 472" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M439 472 L464 472" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="40" y="524" font-size="12" fill="#5F5E5A">⑤ 版本管理：用户终审 merge（数字人卡片上操作）</text>
<path d="M553 506 L553 534 L130 534 L130 544" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="550" width="180" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="130" y="574" text-anchor="middle" font-size="13" font-weight="500" fill="#633806" dominant-baseline="central">用户逐条终审</text>
<text x="130" y="596" text-anchor="middle" font-size="12" fill="#854F0B" dominant-baseline="central">忽略无效提名 · 保留其余</text>
<rect x="253" y="550" width="186" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="346" y="574" text-anchor="middle" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">一键 merge 合并</text>
<text x="346" y="596" text-anchor="middle" font-size="12" fill="#0F6E56" dominant-baseline="central">先快照当前本体段</text>
<rect x="466" y="550" width="174" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="553" y="574" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489" dominant-baseline="central">版本 v+1</text>
<text x="553" y="596" text-anchor="middle" font-size="12" fill="#534AB7" dominant-baseline="central">persona_ontology_versions</text>
<path d="M220 582 L251 582" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M439 582 L464 582" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="40" y="638" font-size="12" fill="#5F5E5A">merge 应用：标注 → 写 note 注记 · 修改 → 改 definition · 删除 → status=deprecated（软删除）</text>
<path d="M553 616 L553 652" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="120" y="656" width="460" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="350" y="680" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489" dominant-baseline="central">版本历史 · 任意版本可回滚 = 恢复快照（回滚前自动再快照）</text>

<rect x="40" y="724" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#378ADD" stroke-width="1" stroke-dasharray="4 3"/>
<text x="60" y="735" font-size="12" fill="#444441">LLM 只提名</text>
<rect x="170" y="724" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="190" y="735" font-size="12" fill="#444441">确定性代码裁决</text>
<rect x="330" y="724" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="350" y="735" font-size="12" fill="#444441">用户终审</text>
<rect x="450" y="724" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="470" y="735" font-size="12" fill="#444441">数据 / 版本落库</text>
</svg>
