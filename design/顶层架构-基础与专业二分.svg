<svg viewBox="0 0 680 468" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>数字人顶层架构：基础数字人与专业数字人二分</title>
<desc>所有数字人都是六元语封装体。基础数字人由平台方用 Spec 编译产生，本体来自平台通用本体库，六元语全部平台写死；专业数字人由部门文档经 RAG 与本体分解器归纳出知识包，与领域专家模板合成，三段写死三段部门填。两条路径最终汇入同一个审批测试迭代闭环。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="24" text-anchor="middle" font-size="14" font-weight="500" fill="#F1EFE8">数字人顶层架构 · 分类轴 = 本体从哪来</text>

<rect x="210" y="40" width="260" height="44" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#F1EFE8">数字人 = 六元语封装体</text>
<path d="M340 84 V97 H180 V110" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 84 V97 H500 V110" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="110" width="280" height="246" rx="20" fill="#042C53" stroke="#85B7EB" stroke-width="0.5"/>
<text x="60" y="134" font-size="14" font-weight="500" fill="#B5D4F4">基础数字人 · 平台级</text>
<rect x="228" y="120" width="72" height="20" rx="10" fill="#5F5E5A" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="264" y="134" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#F1EFE8">待建</text>
<rect x="60" y="148" width="240" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="76" y="170" font-size="14" font-weight="500" fill="#E6F1FB" dominant-baseline="central">ontology 来源</text>
<text x="76" y="190" font-size="12" fill="#B5D4F4" dominant-baseline="central">平台通用本体库 · 人工定义</text>
<rect x="60" y="216" width="240" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="76" y="238" font-size="14" font-weight="500" fill="#E6F1FB" dominant-baseline="central">创建路径</text>
<text x="76" y="258" font-size="12" fill="#B5D4F4" dominant-baseline="central">Spec 编译 · 不经 RAG</text>
<rect x="60" y="284" width="240" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="76" y="306" font-size="14" font-weight="500" fill="#E6F1FB" dominant-baseline="central">六元语归属</text>
<text x="76" y="326" font-size="12" fill="#B5D4F4" dominant-baseline="central">平台全写死 · 无填位</text>

<rect x="360" y="110" width="280" height="246" rx="20" fill="#04342C" stroke="#9FE1CB" stroke-width="0.5"/>
<text x="380" y="134" font-size="14" font-weight="500" fill="#9FE1CB">专业数字人 · 部门级</text>
<rect x="528" y="120" width="92" height="20" rx="10" fill="#854F0B" stroke="#FAC775" stroke-width="0.5"/>
<text x="574" y="134" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#FAEEDA">代码已实现</text>
<rect x="380" y="148" width="240" height="56" rx="8" fill="#085041" stroke="#9FE1CB" stroke-width="0.5"/>
<text x="396" y="170" font-size="14" font-weight="500" fill="#E1F5EE" dominant-baseline="central">ontology 来源</text>
<text x="396" y="190" font-size="12" fill="#9FE1CB" dominant-baseline="central">部门文档 → RAG + EDC</text>
<rect x="380" y="216" width="240" height="56" rx="8" fill="#085041" stroke="#9FE1CB" stroke-width="0.5"/>
<text x="396" y="238" font-size="14" font-weight="500" fill="#E1F5EE" dominant-baseline="central">创建路径</text>
<text x="396" y="258" font-size="12" fill="#9FE1CB" dominant-baseline="central">模板 + 知识包合成</text>
<rect x="380" y="284" width="240" height="56" rx="8" fill="#085041" stroke="#9FE1CB" stroke-width="0.5"/>
<text x="396" y="306" font-size="14" font-weight="500" fill="#E1F5EE" dominant-baseline="central">六元语归属</text>
<text x="396" y="326" font-size="12" fill="#9FE1CB" dominant-baseline="central">3 段写死 + 3 段部门填</text>

<path d="M180 356 V382 H336" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M500 356 V382 H344" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="140" y="384" width="400" height="44" rx="8" fill="#2C2C2A" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="406" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#F1EFE8">生成 → 用户审批 → 跑测试 → 迭代进化 → 注册上线</text>
<text x="340" y="448" text-anchor="middle" font-size="12" fill="#888780">两条路径共用同一闭环：LLM 只提名，代码裁决，用户终审</text>
</svg>
