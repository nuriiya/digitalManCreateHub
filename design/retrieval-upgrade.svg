<svg viewBox="0 0 680 1000" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>检索窗口升级：LLM 提名兜底 + 自适应扩展深度</title>
<desc>字面匹配 0 命中时由 V4-Flash 提名相关本体名（只提名，闭集校验），扩展邻居从固定 1 跳改为预算驱动的自适应深度；benchmark 臂保持 0 LLM 可复现</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="30" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">检索窗口升级：概念抽取兜底（#106）+ 自适应扩展深度（#107）</text>
<text x="340" y="52" text-anchor="middle" font-size="12" fill="#5F5E5A">已确认（概念抽取方案）· LLM 只出概念词（虚线蓝）· 确定性代码裁决（实线绿）· benchmark/compare 保持 0 LLM</text>

<text x="40" y="88" font-size="12" fill="#5F5E5A">① 现状痛点</text>
<rect x="40" y="98" width="292" height="96" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="186" y="118" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">字面匹配的盲区（#106）</text>
<text x="186" y="140" text-anchor="middle" font-size="11.5" fill="#5F5E5A">只认 本体名/英文token/定义关键词 出现</text>
<text x="186" y="158" text-anchor="middle" font-size="11.5" fill="#5F5E5A">同义改述（"图里的人在哪"）→ 0 命中</text>
<text x="186" y="176" text-anchor="middle" font-size="11.5" fill="#5F5E5A">降级 = 按度数取枢纽中心（与话题无关）</text>
<rect x="348" y="98" width="292" height="96" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="494" y="118" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">固定 1 跳的两个问题（#107）</text>
<text x="494" y="140" text-anchor="middle" font-size="11.5" fill="#5F5E5A">L3 只扩 1 跳，预算富余即停（32k 窗口</text>
<text x="494" y="158" text-anchor="middle" font-size="11.5" fill="#5F5E5A">6553 预算经常用不满，浪费近半）</text>
<text x="494" y="176" text-anchor="middle" font-size="11.5" fill="#5F5E5A">1M 窗口（GLM）又缺护栏，怕拉太多</text>

<text x="40" y="224" font-size="12" fill="#5F5E5A">② 改造后检索管线（对话路径 answer()）</text>
<rect x="40" y="234" width="600" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="256" text-anchor="middle" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">用户消息（仅当前消息作匹配源，历史不进检索）→ L0 锚点固定注入</text>
<path d="M340 278 L340 290" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="292" width="600" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="314" text-anchor="middle" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">字面匹配（0 LLM）：整名 3.x · 英文 token 2.0 · 定义关键词 1.0</text>
<path d="M180 336 L180 358" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M500 336 L500 358" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="360" width="280" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="180" y="382" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">命中 ≥ 1（现状路径不变）</text>
<text x="180" y="404" text-anchor="middle" font-size="11.5" fill="#0F6E56">L1 种子 = 命中本体（score 降序）</text>
<rect x="360" y="360" width="280" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" stroke-dasharray="5 3"/>
<text x="500" y="382" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">0 命中 → LLM 概念抽取（仅对话路径）</text>
<text x="500" y="404" text-anchor="middle" font-size="11.5" fill="#185FA5">V4-Flash 小 prompt：用户消息 → 3-8 个概念词（无名单）</text>
<path d="M500 424 L500 446" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="360" y="448" width="280" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="500" y="468" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">确定性本地匹配（代码裁决）</text>
<text x="500" y="488" text-anchor="middle" font-size="11.5" fill="#0F6E56">概念 ⋈ 本体名/定义 双向包含 → 种子 = 命中实体（≤10）</text>
<path d="M500 508 L500 530" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="360" y="532" width="280" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="500" y="552" text-anchor="middle" font-size="12.5" font-weight="500" fill="#085041">概念命中 → 并入 L1 种子</text>
<text x="500" y="572" text-anchor="middle" font-size="11.5" fill="#5F5E5A">无命中/LLM 不可达 → 降级枢纽兜底（不报错）</text>
<path d="M180 424 L180 616" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<path d="M500 592 L500 616" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<path d="M180 616 L340 616" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="620" width="600" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="642" text-anchor="middle" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">L2 命中关系：命中本体（+锚点本体）的出边 · 本体↔本体 优先于 本体→文本</text>
<path d="M340 664 L340 676" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="678" width="600" height="84" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="700" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">L3/L4 自适应扩展（#107）：d = 1, 2, … MAX_DEPTH</text>
<text x="340" y="720" text-anchor="middle" font-size="11.5" fill="#0F6E56">每层：注入 d 跳邻居（度数降序）→ d 跳邻居的关系；预算剩余 &gt; 15% 且 d &lt; 2 才进下一跳</text>
<text x="340" y="740" text-anchor="middle" font-size="11.5" fill="#0F6E56">护栏：注入本体总数 ≤ MAX_INJECTED(400)——防 1M 窗口 2 跳拉进半图谱稀释注意力</text>
<path d="M340 762 L340 774" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="776" width="600" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="798" text-anchor="middle" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">stats 上报：depth_reached · llm_fallback{used,concepts,hits} · budget_used</text>

<text x="40" y="856" font-size="12" fill="#5F5E5A">③ 关键设计决策</text>
<rect x="40" y="866" width="192" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="136" y="886" text-anchor="middle" font-size="12.5" font-weight="500" fill="#085041">benchmark 臂保持 0 LLM</text>
<text x="136" y="906" text-anchor="middle" font-size="11" fill="#0F6E56">_retrieve_context 加</text>
<text x="136" y="922" text-anchor="middle" font-size="11" fill="#0F6E56">nominate=None 参数</text>
<text x="136" y="938" text-anchor="middle" font-size="11" fill="#0F6E56">benchmark/compare 不传</text>
<text x="136" y="954" text-anchor="middle" font-size="11" fill="#0F6E56">→ 四组对照可复现</text>
<rect x="244" y="866" width="192" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="886" text-anchor="middle" font-size="12.5" font-weight="500" fill="#085041">LLM 只出概念词</text>
<text x="340" y="906" text-anchor="middle" font-size="11" fill="#0F6E56">不接触实体选择权，种子</text>
<text x="340" y="922" text-anchor="middle" font-size="11" fill="#0F6E56">全部由确定性代码从</text>
<text x="340" y="938" text-anchor="middle" font-size="11" fill="#0F6E56">active 本体段挑出</text>
<text x="340" y="954" text-anchor="middle" font-size="11" fill="#0F6E56">不可达 → 降级现状行为</text>
<rect x="448" y="866" width="192" height="100" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="544" y="886" text-anchor="middle" font-size="12.5" font-weight="500" fill="#633806">已定参数（用户已审）</text>
<text x="544" y="906" text-anchor="middle" font-size="11" fill="#854F0B">MAX_DEPTH = 2</text>
<text x="544" y="922" text-anchor="middle" font-size="11" fill="#854F0B">MAX_INJECTED = 400</text>
<text x="544" y="938" text-anchor="middle" font-size="11" fill="#854F0B">概念 3-8 个 · 种子≤10</text>
<text x="544" y="954" text-anchor="middle" font-size="11" fill="#854F0B">富余阈值 15% · 仅0命中触发</text>
</svg>
