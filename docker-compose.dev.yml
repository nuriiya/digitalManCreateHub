# Dev override: mount live source into the backend for --reload hot reload,
# and bind the docs dir straight off the host. Load after docker-compose.yml.
# Dev reuses the host's Ollama (host.docker.internal) instead of the 3.5GB
# ollama container, so no huge image pull is needed for local dev.
services:
  backend:
    volumes:
      - ./backend:/app/backend
      - ./client/dist:/app/client/dist
      - ./docs:/data
      # 数据库导出目录：宿主机 exports/ 映射进容器，导出文件可直接 git 提交
      - ./exports:/app/exports
      # MCP 定义导入目录：模型输出的 JSON 放这里，后端自动扫描导入
      - ./mcp_imports:/app/mcp_imports
      # MCP 沙盒构建上下文：start_server 自动 build MCP 镜像时读取
      - ./sandbox:/app/sandbox
    environment:
      ENV: dev
      EMBEDDING_BASE_URL: http://host.docker.internal:11434
      # 外网 LLM 走宿主机代理（deepseek 在当前网络直连 SSL EOF）；见 .env
      LLM_PROXY: ${LLM_PROXY:-}
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
